<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Link Gradient (Cyan to Indigo to Purple) -->
    <linearGradient id="linkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Secondary Link Gradient -->
    <linearGradient id="linkGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Accent Connector Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <g id="link-glyph">
    <!-- Left Loop (Cyan-Indigo) -->
    <path d="M196 140 H164 C115 140 76 179 76 228 C76 277 115 316 164 316 H196 C209 316 220 305 220 292 C220 279 209 268 196 268 H164 C142 268 124 250 124 228 C124 206 142 188 164 188 H196 C209 188 220 177 220 164 C220 151 209 140 196 140 Z" fill="url(#linkGrad1)" />

    <!-- Right Loop (Purple-Pink) -->
    <path d="M316 372 H348 C397 372 436 333 436 284 C436 235 397 196 348 196 H316 C303 196 292 207 292 220 C292 233 303 244 316 244 H348 C370 244 388 262 388 284 C388 306 370 324 348 324 H316 C303 324 292 335 292 348 C292 361 303 372 316 372 Z" fill="url(#linkGrad2)" />

    <!-- Center Interlocking Diagonal Connector Bar -->
    <rect x="182" y="232" width="148" height="48" rx="24" transform="rotate(-38 256 256)" fill="url(#accentGlow)" />
    
    <!-- Core Spark Dots -->
    <circle cx="164" cy="228" r="14" fill="#38BDF8" />
    <circle cx="348" cy="284" r="14" fill="#EC4899" />
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
  </g>
</svg>